<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPACESHIP INVASION</title>
<link rel="stylesheet" href="./src/style.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
</style>
</head>
<body>
<div class="game-wrapper">
  <div id="pauseIndicator" class="hidden" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; font-family: 'Orbitron', sans-serif; font-size: 3rem; color: var(--accent3); text-shadow: 0 0 20px var(--accent3); pointer-events: none; letter-spacing: 12px; font-weight: 900; background: rgba(0,0,0,0.4); padding: 20px 40px; border-radius: 10px;">PAUSED</div>

  <div class="hud">
    <div class="hud-block left" style="min-width: 150px;">
      <div class="hud-label">player</div>
      <div class="hud-value" id="userDisplay" style="color:var(--accent2)">guest</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">score</div>
      <div class="hud-value" id="scoreDisplay">000000</div>
    </div>
    <div class="hud-block center">
      <div class="hud-label">wave</div>
      <div class="hud-value" id="waveDisplay">— —</div>
    </div>
    <div class="hud-block right">
      <div class="hud-label">lives</div>
      <div class="hud-value" id="livesDisplay">♦ ♦ ♦ ♦ ♦</div>
    </div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="bgCanvas"   width="858" height="676"></canvas>
    <canvas id="gameCanvas" width="858" height="676"></canvas>
    <div id="overlay">
      <!-- Content populated by main.js -->
    </div>
  </div>

  <div class="footer-hints">
    <span><em>← →</em> mover</span>
    <span><em>espaço</em> atirar</span>
    <span><em>P</em> pausa</span>
    <span><em>R</em> reiniciar</span>
  </div>
  <div class="version-tag" style="font-size: 0.75rem; color: var(--dim); opacity: 0.5; margin-top: 4px; letter-spacing: 2px;">
    dev edition — v1.0.0
  </div>

</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
